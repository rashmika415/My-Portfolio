<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <style>
      html, body { background-color: #050508; color: #f4f4f5; margin: 0; min-height: 100%; }
    </style>
    <link rel="icon" type="image/svg+xml" href="/images/fav.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <title>Rashmika Prabodhana — Developer Portfolio</title>

  <body>
    <div id="root"></div>
    <script>
      window.addEventListener("error", function (event) {
        var target = event.target;
        if (!target || (target.tagName !== "SCRIPT" && target.tagName !== "LINK")) return;
        if (window.__assetRetry) return;
        window.__assetRetry = true;
        window.location.reload();
      }, true);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
